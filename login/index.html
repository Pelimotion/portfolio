<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELIMOTION — STUDIO ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000; --border: #222; --accent: #ff4b2b;
            --text: #f0f0f0; --text-dim: #555;
            --font-mono: 'DM Mono', monospace; --font-main: 'Outfit', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text); font-family: var(--font-main);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .container { width: 100%; max-width: 420px; padding: 0 20px; }
        .logo {
            font-family: var(--font-mono); font-size: 11px; letter-spacing: 3px;
            color: var(--text-dim); text-transform: uppercase; margin-bottom: 60px;
        }
        .logo span { color: var(--accent); }
        h1 {
            font-size: 32px; font-weight: 300; letter-spacing: -0.5px;
            margin-bottom: 8px; line-height: 1.1;
        }
        .subtitle { font-size: 12px; color: var(--text-dim); margin-bottom: 40px; font-family: var(--font-mono); }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 9px; font-family: var(--font-mono); text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; letter-spacing: 1px; }
        input {
            width: 100%; background: #000; border: 1px solid var(--border);
            color: #fff; padding: 14px 16px; font-family: var(--font-main);
            font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }
        .btn-submit {
            width: 100%; background: #fff; color: #000; border: none;
            padding: 14px; font-family: var(--font-mono); font-size: 11px;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            margin-top: 8px; font-weight: 500; transition: opacity 0.2s;
        }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-submit:hover:not(:disabled) { opacity: 0.85; }
        .error {
            font-size: 11px; font-family: var(--font-mono); color: var(--accent);
            margin-top: 16px; min-height: 16px;
        }
        .divider { border: none; border-top: 1px solid var(--border); margin: 50px 0 30px; }
        .btn-google {
            width: 100%; background: transparent; color: #fff; border: 1px solid var(--border);
            padding: 14px; font-family: var(--font-mono); font-size: 11px;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            margin-bottom: 20px; font-weight: 500; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-google:hover { background: rgba(255,255,255,0.08); border-color: #fff; }
        .or-separator {
            text-align: center; font-size: 10px; font-family: var(--font-mono);
            color: var(--text-dim); margin-bottom: 20px; position: relative;
        }
        .or-separator::before, .or-separator::after {
            content: ''; position: absolute; top: 50%; width: 35%; height: 1px; background: var(--border);
        }
        .or-separator::before { left: 0; }
        .or-separator::after { right: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">PELIMOTION <span>STUDIO</span></div>
        <h1>Studio<br>Access</h1>
        <p class="subtitle">PORTFOLIO // ADMIN // PROJETOS</p>

        <button type="button" class="btn-google" id="btn-google">
            <svg style="width:14px; height:14px;" viewBox="0 0 24 24"><path fill="currentColor" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-6.887 4.114-4.693 0-8.503-3.81-8.503-8.503s3.81-8.503 8.503-8.503c2.202 0 4.2.8 5.76 2.36l3.24-3.24C18.42 1.37 15.42 0 12.24 0 5.48 0 0 5.48 0 12.24s5.48 12.24 12.24 12.24c6.88 0 12.24-5.48 12.24-12.24 0-.82-.08-1.61-.24-2.385H12.24z"/></svg>
            Entrar com Google
        </button>

        <div class="or-separator">OU</div>

        <form id="login-form">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Senha</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-submit" id="btn">ENTRAR</button>
            <div class="error" id="error-msg"></div>
        </form>

        <hr class="divider">
        <div class="footer">Acesso restrito. Apenas usuários autorizados.</div>
    </div>

    <script type="module">
        import { getClient, signIn, getUserRole } from '/shared/auth.js';

        const params = new URLSearchParams(window.location.search);
        const nextUrl = params.get('next');
        const errorParam = params.get('error');

        if (errorParam === 'unauthorized') {
            document.getElementById('error-msg').textContent = 'Acesso negado: seu perfil não tem permissão para essa área.';
        }

        // Verifica sessão diretamente — NÃO usa requireAuth para evitar loop
        // (requireAuth redireciona para /login?next=... quando sem sessão, criando loop infinito)
        const sb = await getClient();
        const { data: { session } } = await sb.auth.getSession();

        // Redireciona para `url`, passando tokens no hash quando o destino é
        // um subdomínio externo (ex: studio.pelimotion.art) — localStorage não é
        // compartilhado entre domínios, então o cliente Supabase do destino
        // lê os tokens do hash e salva a sessão no próprio localStorage.
        async function redirectTo(url) {
            const role = await getUserRole();
            const fallback = role === 'admin' ? '/admin' : '/';
            const target = url || fallback;
            if (target.startsWith('https://studio.pelimotion.art')) {
                const { data: { session: s } } = await sb.auth.getSession();
                if (s) {
                    const hash = `access_token=${s.access_token}&refresh_token=${s.refresh_token}&type=recovery&expires_in=${s.expires_in}`;
                    window.location.href = target.split('#')[0] + '#' + hash;
                    return;
                }
            }
            window.location.href = target;
        }

        if (session) {
            const role = await getUserRole();
            if (role !== 'admin') {
                document.getElementById('error-msg').textContent = 'Acesso negado: seu perfil não possui privilégios de administrador.';
            } else {
                const dest = errorParam === 'unauthorized' ? null : nextUrl;
                await redirectTo(dest || '/admin');
            }
        }

        document.getElementById('btn-google').onclick = async () => {
            const dest = params.get('next') || '/admin';
            const { error } = await sb.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/login/index.html?next=' + encodeURIComponent(dest)
                }
            });
            if (error) {
                document.getElementById('error-msg').textContent = 'Erro no login com Google: ' + error.message;
            }
        };

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            const errEl = document.getElementById('error-msg');
            btn.disabled = true;
            btn.textContent = 'VERIFICANDO...';
            errEl.textContent = '';

            const { error } = await signIn(
                document.getElementById('email').value,
                document.getElementById('password').value
            );

            if (error) {
                errEl.textContent = 'Credenciais inválidas. Tente novamente.';
                btn.disabled = false;
                btn.textContent = 'ENTRAR';
            } else {
                await redirectTo(nextUrl);
            }
        };
    </script>
</body>
</html>
