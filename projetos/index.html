<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Painel de gestão de projetos Pelimotion — Kanban por status de produção." />
  <title>Projetos — Pelimotion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Banner de erro (gerenciado por showError em app.js) ─────────────── -->
  <div id="error-banner" class="error-banner" hidden></div>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!--  ESTADO: SEM SESSÃO                                                   -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <div id="login-view" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
    <div class="login-card">
      <img src="../logo.svg" alt="Pelimotion" class="login-logo" />
      <h1 class="login-title">Área de Projetos</h1>
      <p class="login-subtitle">Acesso restrito à equipe Pelimotion.</p>
      <form id="form-login" onsubmit="signInWithPassword(event)">
        <label for="input-email" class="form-label">E-mail</label>
        <input id="input-email" type="email" class="form-input" required placeholder="seu@email.com" />
        
        <label for="input-password" class="form-label">Senha</label>
        <input id="input-password" type="password" class="form-input" required placeholder="••••••••" />
        
        <button id="btn-login" type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Entrar</button>
        <div id="login-error" class="error-banner" hidden style="margin-top: 1rem; border-radius: 4px;"></div>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!--  ESTADO: COM SESSÃO                                                   -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <div id="app-view" style="display: none;">

    <!-- Header ─────────────────────────────────────────────────────────── -->
    <header class="app-header">
      <div class="header-brand">
        <img src="../logo.svg" alt="Pelimotion" class="header-logo" />
        <span class="header-title">Projetos</span>
      </div>
      <div class="header-actions">
        <span id="header-user" class="header-user"></span>
        <button id="btn-new-project" class="btn btn-primary" onclick="openModal()" disabled>+ Novo Projeto</button>
        <button class="btn btn-ghost" onclick="signOut()">Sair</button>
      </div>
    </header>

    <!-- Kanban ─────────────────────────────────────────────────────────── -->
    <main class="kanban-wrapper">
      <div class="kanban-board" id="kanban-board">

        <div class="kanban-column" id="col-briefing">
          <div class="column-header">
            <span class="column-dot dot-briefing"></span>
            Briefing
          </div>
          <div class="column-cards" id="cards-briefing" data-status="briefing"></div>
        </div>

        <div class="kanban-column" id="col-producao">
          <div class="column-header">
            <span class="column-dot dot-producao"></span>
            Produção
          </div>
          <div class="column-cards" id="cards-producao" data-status="producao"></div>
        </div>

        <div class="kanban-column" id="col-revisao">
          <div class="column-header">
            <span class="column-dot dot-revisao"></span>
            Revisão
          </div>
          <div class="column-cards" id="cards-revisao" data-status="revisao"></div>
        </div>

        <div class="kanban-column" id="col-entregue">
          <div class="column-header">
            <span class="column-dot dot-entregue"></span>
            Entregue
          </div>
          <div class="column-cards" id="cards-entregue" data-status="entregue"></div>
        </div>

      </div>
    </main>


  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!--  MODAL: Novo Projeto                                                  -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <div id="modal-overlay" class="modal-overlay" hidden onclick="closeModalOnOverlay(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
      <div class="modal-header">
        <h2 id="modal-heading" class="modal-title">Novo Projeto</h2>
        <button class="modal-close" onclick="closeModal()" aria-label="Fechar">✕</button>
      </div>
      <form id="form-new-project" class="modal-form" onsubmit="submitNewProject(event)">
        <label for="input-title" class="form-label">Título <span class="required">*</span></label>
        <input id="input-title" name="title" type="text" class="form-input" placeholder="Nome do projeto" required />

        <label for="input-desc" class="form-label">Descrição</label>
        <textarea id="input-desc" name="description" class="form-textarea" rows="3" placeholder="Breve descrição do projeto"></textarea>

        <label for="input-drive" class="form-label">URL da pasta no Drive</label>
        <input id="input-drive" name="drive_folder_url" type="url" class="form-input" placeholder="https://drive.google.com/drive/folders/..." />

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button id="btn-submit-project" type="submit" class="btn btn-primary">Criar Projeto</button>
        </div>
      </form>
    </div>
  </div>
  </div><!-- /#app-view -->
  <!-- ── CDN ──────────────────────────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="app.js"></script>
  <script src="kanban.js"></script>

  <script>
    // ── Gatekeeper State Machine ──────────────────────────────────────────
    function setUIState(isAuthenticated, userEmail = '') {
      document.getElementById('login-view').style.display = isAuthenticated ? 'none' : 'flex';
      document.getElementById('app-view').style.display = isAuthenticated ? 'block' : 'none';
      
      if (isAuthenticated) {
        document.getElementById('header-user').textContent = userEmail;
        document.getElementById('btn-new-project').disabled = false;
      } else {
        document.getElementById('btn-new-project').disabled = true;
      }
    }

    let isAppReady = false;

    // A ÚNICA fonte de verdade para o estado da sessão
    db.auth.onAuthStateChange(async (event, session) => {
      console.log('[Auth] Event:', event);
      const isAuthenticated = !!session;
      
      setUIState(isAuthenticated, session ? session.user.email : '');

      // Só carrega os dados do banco na primeira vez que logar
      if (isAuthenticated && !isAppReady) {
        isAppReady = true;
        await loadProjects();
        initKanban(document.querySelectorAll('.column-cards'), 'projects');
      }
    });

    // Boot Seguro
    (async function init() {
      const { data: { session } } = await db.auth.getSession();
      setUIState(!!session, session ? session.user.email : '');
    })();

    // ── Carregar projetos ────────────────────────────────────────────────
    async function loadProjects() {
      try {
        const { data, error } = await db
          .from('projects')
          .select('*')
          .order('created_at');
        if (error) throw error;

        // Limpar colunas antes de popular
        document.querySelectorAll('.column-cards').forEach(c => {
          while (c.firstChild) c.removeChild(c.firstChild);
        });

        data.forEach(renderProjectCard);
      } catch (err) {
        showError('Erro ao carregar projetos: ' + err.message);
      }
    }

    // ── Renderizar card ──────────────────────────────────────────────────
    function renderProjectCard(project) {
      const col = document.getElementById('cards-' + project.status);
      if (!col) return;

      const card = document.createElement('div');
      card.className = 'kanban-card';
      card.dataset.id = project.id;
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');

      const title = document.createElement('p');
      title.className = 'card-title';
      title.textContent = project.title;

      card.appendChild(title);

      if (project.description) {
        const desc = document.createElement('p');
        desc.className = 'card-desc';
        desc.textContent = project.description;
        card.appendChild(desc);
      }

      if (project.drive_folder_url) {
        const link = document.createElement('a');
        link.className = 'card-drive-link';
        link.href = project.drive_folder_url;
        link.textContent = '📁 Drive';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.addEventListener('click', e => e.stopPropagation());
        card.appendChild(link);
      }

      // Navega para projeto.html ao clicar no card
      card.addEventListener('click', () => {
        window.location.href = 'projeto.html?id=' + project.id;
      });
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          window.location.href = 'projeto.html?id=' + project.id;
        }
      });

      col.appendChild(card);
    }

    // ── Modal & UX ─────────────────────────────────────────────────────────
    let modalTriggerElement = null; // para retornar o foco

    function openModal() {
      modalTriggerElement = document.activeElement; // guarda quem abriu o modal
      document.getElementById('modal-overlay').removeAttribute('hidden');
      document.getElementById('input-title').focus();
      document.addEventListener('keydown', handleEsc);
    }

    function closeModal() {
      document.getElementById('modal-overlay').setAttribute('hidden', '');
      document.getElementById('form-new-project').reset();
      document.removeEventListener('keydown', handleEsc);
      
      // Devolve o foco para o botão que abriu (acessibilidade)
      if (modalTriggerElement) {
        modalTriggerElement.focus();
      }
    }

    function closeModalOnOverlay(e) {
      // Se clicou exatamente no overlay escuro (fundo) e não no modal em si
      if (e.target.id === 'modal-overlay') {
        closeModal();
      }
    }

    function handleEsc(e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    }

    async function submitNewProject(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-project');
      btn.disabled = true;
      btn.textContent = 'Criando…';

      try {
        // ── Guard: busca sessão limpa diretamente na fonte de verdade ────
        const { data: authData, error: authErr } = await db.auth.getSession();
        
        if (authErr || !authData.session) {
          showError('Sessão expirada. Redirecionando para login...');
          setTimeout(() => window.location.reload(), 1500); // recarrega a página para resetar a state machine
          return;
        }

        const form = e.target;
        const payload = {
          title:            form.title.value.trim(),
          description:      form.description.value.trim() || null,
          drive_folder_url: form.drive_folder_url.value.trim() || null,
          status:           'briefing',
        };

        // ── Insert via SDK (JWT é anexado automaticamente) ────────────────
        const { data, error } = await db
          .from('projects')
          .insert(payload)
          .select()
          .single();
        if (error) throw error;

        renderProjectCard(data);
        closeModal();
        if (typeof showToast === 'function') {
          showToast('Projeto criado com sucesso!', 'success');
        }
      } catch (err) {
        if (typeof showToast === 'function') {
          showToast('Erro ao criar projeto: ' + err.message, 'error');
        } else {
          showError('Erro ao criar projeto: ' + err.message);
        }
      } finally {
        btn.disabled = false;
        btn.textContent = 'Criar Projeto';
      }
    }
  </script>

</body>
</html>
