<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELIMOTION — Studio Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000; --bg2: #0a0a0a; --border: #1e1e1e; --border2: #2a2a2a;
            --accent: #ff4b2b; --text: #f0f0f0; --text-dim: #555; --text-mid: #888;
            --green: #00c47d; --yellow: #f5a623;
            --font-mono: 'DM Mono', monospace; --font-main: 'Outfit', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-main); min-height: 100vh; }

        /* Loading */
        #loading {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: var(--font-mono); font-size: 10px; letter-spacing: 3px;
            color: var(--text-dim); text-transform: uppercase;
        }

        /* Header */
        .header {
            border-bottom: 1px solid var(--border);
            padding: 14px 40px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { font-family: var(--font-mono); font-size: 10px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; }
        .logo span { color: var(--accent); }
        .header-right { display: flex; align-items: center; gap: 16px; }
        #user-email { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
        .role-badge {
            font-family: var(--font-mono); font-size: 8px; font-weight: 500;
            letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 2px;
        }
        .role-badge.admin  { background: rgba(255,75,43,.15); color: var(--accent); }
        .role-badge.editor { background: rgba(0,196,125,.15); color: var(--green); }
        .role-badge.viewer { background: rgba(255,255,255,.06); color: var(--text-mid); }
        .btn-signout {
            font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px;
            text-transform: uppercase; color: var(--text-dim); background: none;
            border: 1px solid var(--border2); padding: 6px 12px; cursor: pointer;
            transition: border-color .2s, color .2s;
        }
        .btn-signout:hover { border-color: var(--text-mid); color: var(--text); }

        /* Main */
        .main { max-width: 1000px; margin: 0 auto; padding: 56px 40px 80px; }
        .title-block { margin-bottom: 48px; }
        .title-block h1 { font-size: 40px; font-weight: 300; letter-spacing: -1px; line-height: 1.05; margin-bottom: 10px; }
        .title-block p { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); letter-spacing: .5px; }

        /* Unauthorized notice */
        .notice {
            background: rgba(255,75,43,.08); border: 1px solid rgba(255,75,43,.2);
            padding: 12px 20px; margin-bottom: 32px;
            font-family: var(--font-mono); font-size: 10px; color: var(--accent);
            display: flex; align-items: center; gap: 10px;
        }

        /* Cards grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1px; background: var(--border);
            border: 1px solid var(--border);
        }
        .card {
            background: var(--bg); padding: 28px; position: relative;
            display: flex; flex-direction: column; gap: 0;
            transition: background .15s;
        }
        .card.accessible:hover { background: #080808; cursor: default; }
        .card.locked { opacity: 0.38; }
        .card-icon { font-size: 22px; margin-bottom: 18px; display: block; line-height: 1; }
        .card-name { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
        .card-desc {
            font-size: 11px; color: var(--text-dim); font-family: var(--font-mono);
            line-height: 1.65; margin-bottom: 24px; flex: 1;
        }
        .card-footer { display: flex; align-items: center; justify-content: space-between; }
        .access-label {
            font-family: var(--font-mono); font-size: 8px; font-weight: 500;
            letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 2px;
        }
        .access-label.admin  { background: rgba(255,75,43,.1); color: var(--accent); }
        .access-label.editor { background: rgba(0,196,125,.1); color: var(--green); }
        .access-label.viewer { background: rgba(255,255,255,.05); color: var(--text-mid); }
        .btn-go {
            font-family: var(--font-mono); font-size: 9px; font-weight: 500;
            letter-spacing: 1.5px; text-transform: uppercase;
            background: var(--text); color: var(--bg); border: none;
            padding: 9px 18px; cursor: pointer; text-decoration: none;
            display: inline-block; transition: opacity .15s;
        }
        .btn-go:hover { opacity: .82; }
        .lock { font-size: 13px; color: var(--text-dim); }

        /* Future placeholder */
        .future {
            border: 1px dashed var(--border2); border-top: none;
            padding: 18px 28px;
            font-family: var(--font-mono); font-size: 9px; color: var(--text-dim);
            letter-spacing: 1px; text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .header { padding: 12px 20px; }
            .main { padding: 36px 20px 60px; }
            .title-block h1 { font-size: 28px; }
            #user-email { display: none; }
        }
    </style>
</head>
<body>
    <div id="loading">Carregando...</div>
    <div id="app" style="display:none">
        <header class="header">
            <div class="logo">PELIMOTION <span>STUDIO</span></div>
            <div class="header-right">
                <span id="user-email"></span>
                <span class="role-badge" id="role-badge"></span>
                <button class="btn-signout" id="btn-signout">Sair</button>
            </div>
        </header>
        <main class="main">
            <div class="title-block">
                <h1>Studio<br>Hub</h1>
                <p>Selecione o sistema que deseja acessar.</p>
            </div>
            <div id="notice" style="display:none" class="notice">
                <span>⚠</span>
                <span>Seu perfil não tem permissão para acessar essa área. Abaixo estão os sistemas disponíveis para você.</span>
            </div>
            <div class="grid" id="grid"></div>
            <div class="future">+ Novos sistemas serão adicionados aqui conforme o ecossistema cresce.</div>
        </main>
    </div>

    <script type="module">
        import { requireAuth, getUserProfile, signOut } from '/shared/auth.js';

        const SECTIONS = [
            {
                icon: '⚙️',
                name: 'Admin Panel',
                desc: 'Landing page, Bunny.net, deploy e\nconfigurações globais do ecossistema.',
                url: '/admin',
                role: 'admin',
            },
            {
                icon: '✍️',
                name: 'Blog Generator',
                desc: 'CMS editorial, geração de conteúdo com IA,\npublicação de artigos e imagens.',
                url: '/blog-generator',
                role: 'editor',
            },
            {
                icon: '📋',
                name: 'Projetos App',
                desc: 'Gerenciador interno de projetos,\nkanban, cenas e daily log.',
                url: '/projetos',
                role: 'viewer',
            },
        ];

        const HIERARCHY = { admin: 3, editor: 2, viewer: 1 };
        const ROLE_LABEL = { admin: 'Admin', editor: 'Editor', viewer: 'Viewer' };
        const ROLE_REQ   = { admin: 'Apenas admin', editor: 'Editor+', viewer: 'Todos' };

        function canAccess(userRole, required) {
            return (HIERARCHY[userRole] || 0) >= (HIERARCHY[required] || 1);
        }

        function renderGrid(userRole) {
            document.getElementById('grid').innerHTML = SECTIONS.map(s => {
                const ok = canAccess(userRole, s.role);
                return `<div class="card ${ok ? 'accessible' : 'locked'}">
                    <span class="card-icon">${s.icon}</span>
                    <div class="card-name">${s.name}</div>
                    <div class="card-desc">${s.desc.replace('\n', '<br>')}</div>
                    <div class="card-footer">
                        <span class="access-label ${s.role}">${ROLE_REQ[s.role]}</span>
                        ${ok ? `<a href="${s.url}" class="btn-go">Acessar →</a>`
                              : `<span class="lock">🔒</span>`}
                    </div>
                </div>`;
            }).join('');
        }

        async function init() {
            const session = await requireAuth('/login');
            if (!session) return;

            const profile = await getUserProfile();
            const role  = profile?.role  || 'editor';
            const email = profile?.email || session.user.email;

            document.getElementById('user-email').textContent = email;
            const badge = document.getElementById('role-badge');
            badge.textContent = ROLE_LABEL[role] || role;
            badge.className = `role-badge ${role}`;

            if (new URLSearchParams(location.search).get('error') === 'unauthorized') {
                document.getElementById('notice').style.display = 'flex';
            }

            renderGrid(role);
            document.getElementById('btn-signout').onclick = () => signOut();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        init();
    </script>
</body>
</html>
