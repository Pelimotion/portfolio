<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wide Image Studio — Pelimotion</title>
  <link rel="stylesheet" href="/css/studio.css" />
</head>
<body>

<header>
  <h1>Wide Image <span>Studio</span></h1>
  <div class="header-right">
    <span id="user-email"></span>
    <button class="btn-ghost" onclick="signOut()">Sair</button>
  </div>
</header>

<div id="app" class="hidden">
<main>

  <!-- ── Phase: form ─────────────────────────────────────────── -->
  <div id="phase-form">

    <div class="card">
      <h2>Display &amp; Estilo</h2>
      <div class="field-row">
        <div class="field">
          <label>Preset de display</label>
          <select id="f-preset"></select>
        </div>
        <div class="field">
          <label>Estilo visual</label>
          <select id="f-style"></select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Cena</h2>
      <div class="field">
        <label>Master prompt <span style="color:var(--danger)">*</span></label>
        <textarea id="f-prompt" placeholder="Descreva a cena completa do display. Ex: aerial view of São Paulo downtown at golden hour, skyscrapers casting long shadows, street lights beginning to glow…"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Seed (deixe vazio para aleatório)</label>
          <input id="f-seed" type="number" placeholder="ex: 42" min="0" />
        </div>
        <div class="field">
          <label>Soul ID (opcional — trava identidade visual)</label>
          <input id="f-soul-id" type="text" placeholder="URL ou ID do Soul Higgsfield" />
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Referências (máx 5)</h2>
      <div id="ref-list" class="ref-list"></div>
      <button class="btn-add" onclick="onAddRef()">+ Adicionar referência</button>
    </div>

    <div class="card">
      <h2>Foco regional por tile <span style="font-weight:400;text-transform:none;font-size:11px">(opcional — guia composição de cada tile)</span></h2>
      <div id="region-inputs" class="region-inputs"></div>
    </div>

    <div class="card">
      <div class="cost-bar">
        <span class="cost-label">Custo estimado</span>
        <span id="cost-estimate">—</span>
      </div>
      <div style="margin-top:12px">
        <button class="btn btn-primary" onclick="onGenerate()">→ Gerar master plate</button>
      </div>
    </div>

  </div>

  <!-- ── Phase: generating ───────────────────────────────────── -->
  <div id="phase-generating" class="hidden">
    <div class="card">
      <div class="status-bar">
        <div class="spinner"></div>
        <span id="status-msg">Iniciando…</span>
      </div>
      <div class="job-id">Job: <span id="job-id-display">—</span></div>
    </div>
  </div>

  <!-- ── Phase: master-review ────────────────────────────────── -->
  <div id="phase-master-review" class="hidden">
    <div class="card">
      <h2>Master plate — revise antes de gastar ~$3</h2>
      <div class="status-bar">
        <span id="status-msg"></span>
      </div>
      <img id="master-img" class="hidden" alt="Master plate" crossorigin="anonymous" />
      <div class="action-row">
        <button id="btn-approve" class="btn btn-primary" onclick="onApprove()">✓ Aprovar — gerar tiles</button>
        <button id="btn-reject" class="btn btn-danger" onclick="onReject()">✗ Rejeitar</button>
      </div>
    </div>
  </div>

  <!-- ── Phase: tiles ────────────────────────────────────────── -->
  <div id="phase-tiles" class="hidden">
    <div class="card">
      <h2>Tiles</h2>
      <div class="status-bar">
        <div class="spinner"></div>
        <span id="status-msg"></span>
      </div>
      <div id="tile-grid" class="tile-grid"></div>
      <div style="margin-top:16px">
        <button id="btn-stitch" class="btn btn-primary hidden" onclick="onStitch()">⬇ Stitch &amp; Download</button>
      </div>
      <div id="stitch-progress" class="hidden" style="margin-top:10px">
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px">Montando…</div>
        <div class="progress-wrap"><div id="stitch-progress-bar" class="progress-bar"></div></div>
      </div>
    </div>
  </div>

</main>
</div><!-- #app -->

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
