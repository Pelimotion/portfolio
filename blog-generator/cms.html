<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelimotion Studio | Content Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --bg-sec: #0a0a0a; --card-bg: #0f0f0f;
            --primary: #fff; --accent: #ff4b2b; --text: #eee; --text-secondary: #888;
            --border: #222; --font-main: 'Outfit', sans-serif; --font-mono: 'DM Mono', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-main); overflow: hidden; }
        
        /* Layout */
        .admin-layout { display: grid; grid-template-rows: 60px 1fr; height: 100vh; }
        .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 30px; border-bottom: 1px solid var(--border); background: var(--bg-sec); z-index: 100; }
        .main-container { display: flex; height: 100%; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 320px; background: var(--bg-sec); border-right: 1px solid var(--border); padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; }
        .workspace { flex: 1; padding: 40px; overflow-y: auto; position: relative; background: var(--bg); }

        /* Typography & Components */
        .logo { font-family: var(--font-main); font-weight: 600; letter-spacing: 2px; font-size: 14px; }
        .logo span { color: var(--accent); font-weight: 300; }
        .card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .card-title { font-size: 11px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 15px; letter-spacing: 1px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        
        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 10px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
        input, select, textarea { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 4px; font-family: inherit; font-size: 13px; }
        textarea { resize: vertical; }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }
        
        .btn { background: #111; border: 1px solid var(--border); color: #fff; padding: 8px 16px; cursor: pointer; font-size: 11px; font-family: var(--font-mono); transition: 0.3s; border-radius: 4px; text-transform: uppercase; }
        .btn:hover { background: #222; border-color: #444; }
        .btn.primary { background: var(--primary); color: #000; border-color: var(--primary); font-weight: bold; }
        .btn.ai { border-color: var(--accent); color: var(--accent); }
        .btn.ai:hover { background: var(--accent); color: #fff; }

        /* Workflow Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; }
        .tab { background: transparent; border: none; color: var(--text-secondary); font-family: var(--font-mono); font-size: 12px; cursor: pointer; padding: 8px 0; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--primary); border-bottom-color: var(--accent); }

        .stage-container { display: none; }
        .stage-container.active { display: block; }

        /* Image Manager */
        .image-manager-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .image-card { background: #0a0a0a; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
        .image-card:hover { border-color: #444; transform: translateY(-2px); }
        .image-card .preview { width: 100%; aspect-ratio: 16/9; background: #111; position: relative; }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .image-card .info { padding: 15px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .image-card textarea { font-size: 11px; min-height: 80px; }
        .image-card .controls { display: flex; justify-content: space-between; gap: 5px; }

        /* Post List Sidebar */
        .post-list { display: flex; flex-direction: column; gap: 5px; }
        .post-item { padding: 10px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .post-item:hover { background: #111; }
        .post-item.active { background: #1a1a1a; border-color: var(--border); color: var(--accent); }
        
        #loader { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal */
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 500; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 40px; border-radius: 12px; width: 90%; max-width: 800px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text" style="margin-top:20px; font-family:var(--font-mono); color:var(--accent);">SINCRONIZANDO...</div>
    </div>

    <div class="admin-layout">
        <nav class="top-nav">
            <div class="logo">PELIMOTION <span>STUDIO v4.0</span></div>
            <div style="display:flex; gap:12px;">
                <button class="btn" onclick="openGallery()">🖼️ GALERIA</button>
                <button class="btn ai" onclick="savePost()">💾 SALVAR NO SUPABASE</button>
                <button class="btn primary" onclick="deployToVercel()">🚀 PUBLICAR NO SITE</button>
            </div>
        </nav>

        <div class="main-container">
            <aside class="sidebar">
                <div class="card">
                    <div class="card-title">PROJETO ATUAL</div>
                    <div class="field">
                        <label>Status</label>
                        <select id="f-status">
                            <option value="draft">🟡 RASCUNHO</option>
                            <option value="published">🟢 PUBLICADO</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Categoria</label>
                        <input type="text" id="f-category" placeholder="ex: Técnica">
                    </div>
                    <div class="field">
                        <label>Slug (URL)</label>
                        <input type="text" id="f-slug" oninput="this.value = this.value.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '')">
                    </div>
                    <div class="field">
                        <label>Data</label>
                        <input type="date" id="f-date">
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">ARTIGOS <button class="btn" onclick="createNewPost()" style="padding:2px 8px;">+</button></div>
                    <div id="post-list" class="post-list">
                        <!-- Posts injected here -->
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">CONEXÕES</div>
                    <input type="password" id="studio-pin" placeholder="PIN DE ACESSO" style="font-size:10px; margin-bottom:10px;" onkeyup="if(event.key==='Enter') checkAuth()">
                    <button class="btn" style="width:100%" onclick="checkAuth()">AUTENTICAR</button>
                </div>
            </aside>

            <main class="workspace">
                <div class="tabs">
                    <button class="tab active" onclick="switchStage(1)">01. ESTRATÉGIA</button>
                    <button class="tab" onclick="switchStage(2)">02. ESTRUTURA</button>
                    <button class="tab" onclick="switchStage(3)">03. CONTEÚDO</button>
                    <button class="tab" onclick="switchStage(4)">04. VISUAL (IMAGENS)</button>
                </div>

                <!-- Stage 1 -->
                <div class="stage-container active" id="stage-1">
                    <div class="card">
                        <div class="card-title">BRAINSTORM & SEO</div>
                        <div class="field">
                            <label>Assunto ou Tema</label>
                            <div style="display:flex; gap:10px;">
                                <input type="text" id="f-keyword" placeholder="ex: tendências de motion design 2026">
                                <button class="btn ai" onclick="aiStep1()">✨ GERAR ESTRATÉGIA</button>
                            </div>
                        </div>
                        <div class="field">
                            <label>Título do Post</label>
                            <input type="text" id="f-title" style="font-size:20px; font-weight:600;">
                        </div>
                        <div class="field">
                            <label>Meta Description</label>
                            <textarea id="f-metaDescription" rows="3"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Stage 2 -->
                <div class="stage-container" id="stage-2">
                    <div class="card">
                        <div class="card-title">OUTLINE (TÓPICOS) <button class="btn ai" onclick="aiStep2()">✨ GERAR TÓPICOS</button></div>
                        <div id="outline-list"></div>
                        <button class="btn" style="margin-top:15px;" onclick="addOutlineItem()">+ ADICIONAR SEÇÃO</button>
                    </div>
                </div>

                <!-- Stage 3 -->
                <div class="stage-container" id="stage-3">
                    <div class="card" style="height: calc(100vh - 250px); display:flex; flex-direction:column;">
                        <div class="card-title">CONTEÚDO FINAL (MARKDOWN) <button class="btn ai" onclick="aiStep3()">✨ ESCREVER TUDO</button></div>
                        <textarea id="f-content" style="flex:1; background:#000; color:#eee; font-family:var(--font-mono); line-height:1.7; padding:25px; border:none;"></textarea>
                    </div>
                </div>

                <!-- Stage 4 -->
                <div class="stage-container" id="stage-4">
                    <div class="card">
                        <div class="card-title">
                            DIREÇÃO DE ARTE & IMAGENS
                            <div style="display:flex; gap:10px;">
                                <button class="btn" onclick="addImageSlot()">+ NOVO SLOT</button>
                                <button class="btn ai" onclick="generateAllImages()">✨ GERAR TODAS AS FALTANTES</button>
                            </div>
                        </div>
                        <div id="image-manager-grid" class="image-manager-grid">
                            <!-- Image cards injected here -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Gallery Modal -->
    <div id="modal">
        <div class="modal-content">
            <div class="card-title">GALERIA COMPARTILHADA <button class="btn" onclick="document.getElementById('modal').style.display='none'">✕</button></div>
            <div id="gallery-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:15px; max-height:500px; overflow-y:auto;">
                <!-- Gallery items -->
            </div>
        </div>
    </div>

    <script>
        let currentPost = null;
        let posts = [];
        const CDN = 'https://pelimotion-portfolio.b-cdn.net';

        // --- AUTH & INITIALIZATION ---
        async function checkAuth() {
            const pin = document.getElementById('studio-pin').value || localStorage.getItem('pelimotion_pin');
            if (pin === '0101') {
                localStorage.setItem('pelimotion_pin', pin);
                document.getElementById('auth-info').innerText = '✅ STUDIO AUTENTICADO';
                init();
            } else {
                alert('PIN INCORRETO');
            }
        }

        async function init() {
            showLoader("CARREGANDO DADOS...");
            await loadPosts();
            hideLoader();
        }

        // --- NAVIGATION ---
        function switchStage(n) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i+1 === n));
            document.querySelectorAll('.stage-container').forEach((s, i) => s.classList.toggle('active', i+1 === n));
        }

        async function loadPosts() {
            const res = await fetch('/api/blog/posts');
            posts = await res.json();
            const list = document.getElementById('post-list');
            list.innerHTML = "";
            posts.forEach(p => {
                const div = document.createElement('div');
                div.className = `post-item ${currentPost?.data?.slug === p.data?.slug ? 'active' : ''}`;
                div.innerHTML = `<span>${p.data.title || 'Sem título'}</span>`;
                div.onclick = () => openPost(p);
                list.appendChild(div);
            });
        }

        function openPost(p) {
            currentPost = p;
            document.getElementById('f-title').value = p.data.title || '';
            document.getElementById('f-slug').value = p.data.slug || '';
            document.getElementById('f-category').value = p.data.category || '';
            document.getElementById('f-status').value = p.data.status || 'draft';
            document.getElementById('f-metaDescription').value = p.data.metaDescription || '';
            document.getElementById('f-keyword').value = p.data.keywords?.[0] || '';
            document.getElementById('f-date').value = p.data.date || '';
            document.getElementById('f-content').value = p.content || '';
            
            renderImageSlots(p.data.images || []);
            loadPosts();
        }

        function createNewPost() {
            const newPost = {
                data: { title: "Novo Artigo", slug: "novo-artigo-" + Date.now(), status: "draft", images: [{id: 'hero', prompt: 'Cinematic wide shot...', url: ''}] },
                content: ""
            };
            openPost(newPost);
        }

        // --- IMAGE MANAGER ---
        function renderImageSlots(images) {
            const grid = document.getElementById('image-manager-grid');
            grid.innerHTML = "";
            
            if (images.length === 0) {
                images.push({ id: 'hero', prompt: 'Cinematic hero shot...', url: '' });
            }

            images.forEach((img, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                const cacheBuster = Date.now();
                const imgSrc = img.url ? (img.url.startsWith('http') ? img.url : `${CDN}${img.url}?t=${cacheBuster}`) : '';
                
                card.innerHTML = `
                    <div class="preview">
                        ${imgSrc ? `<img src="${imgSrc}" id="img-preview-${index}">` : `<div style="padding:40px; text-align:center; color:#333;">Sem Imagem</div>`}
                    </div>
                    <div class="info">
                        <div style="font-size:9px; color:var(--accent); font-weight:bold;">SLOT: ${img.id.toUpperCase()}</div>
                        <textarea placeholder="Prompt Visual..." onchange="updateImagePrompt(${index}, this.value)">${img.prompt || ''}</textarea>
                        <div class="controls">
                            <button class="btn ai" onclick="generateSingleImage(${index})">✨ GERAR</button>
                            <button class="btn" onclick="openGallery(${index})">🖼️ GALERIA</button>
                            <button class="btn" style="position:relative;">
                                📤 SUBIR
                                <input type="file" style="position:absolute; inset:0; opacity:0; cursor:pointer;" onchange="uploadToSlot(this, ${index})">
                            </button>
                            <button class="btn" onclick="removeImageSlot(${index})">✕</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            currentPost.data.images = images;
        }

        function addImageSlot() {
            const id = 'img-' + Date.now();
            currentPost.data.images.push({ id, prompt: '', url: '' });
            renderImageSlots(currentPost.data.images);
        }

        function removeImageSlot(index) {
            currentPost.data.images.splice(index, 1);
            renderImageSlots(currentPost.data.images);
        }

        function updateImagePrompt(index, val) {
            currentPost.data.images[index].prompt = val;
        }

        async function generateSingleImage(index) {
            const img = currentPost.data.images[index];
            const slug = document.getElementById('f-slug').value;
            if (!img.prompt || !slug) return alert("Prompt e Slug são obrigatórios!");

            showLoader(`GERANDO ${img.id.toUpperCase()}...`);
            try {
                const res = await fetch('/api/blog/generate-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: img.prompt, slug: slug, imageName: img.id })
                });
                if (!res.ok) throw new Error("Falha na geração");
                
                currentPost.data.images[index].url = `/blog/assets/${slug}/${img.id}.jpg`;
                alert("Imagem gerada com sucesso!");
                renderImageSlots(currentPost.data.images);
            } catch(e) { alert(e.message); }
            hideLoader();
        }

        async function generateAllImages() {
            const slug = document.getElementById('f-slug').value;
            const images = currentPost.data.images;
            showLoader("NANO BANANA EM MODO TURBO...");
            
            const tasks = images.map(async (img, index) => {
                if (img.url) return; // Skip already generated
                const res = await fetch('/api/blog/generate-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: img.prompt, slug: slug, imageName: img.id })
                });
                if (res.ok) currentPost.data.images[index].url = `/blog/assets/${slug}/${img.id}.jpg`;
            });

            await Promise.allSettled(tasks);
            renderImageSlots(currentPost.data.images);
            hideLoader();
            alert("Processo concluído!");
        }

        async function uploadToSlot(input, index) {
            const file = input.files[0];
            if (!file) return;
            const slug = document.getElementById('f-slug').value;
            const id = currentPost.data.images[index].id;

            const reader = new FileReader();
            reader.onload = async (e) => {
                showLoader("SUBINDO IMAGEM...");
                const imageData = e.target.result;
                await fetch('/api/blog/upload-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageData, slug, imageName: id })
                });
                currentPost.data.images[index].url = `/blog/assets/${slug}/${id}.jpg`;
                renderImageSlots(currentPost.data.images);
                hideLoader();
            };
            reader.readAsDataURL(file);
        }

        // --- AI WORKFLOW ---
        async function askAI(prompt, type = 'flash') {
            const res = await fetch('/api/blog/generate-text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, modelType: type })
            });
            const data = await res.json();
            return data.content;
        }

        async function aiStep1() {
            const keyword = document.getElementById('f-keyword').value;
            if (!keyword) return alert("Insira um tema!");
            showLoader("ESTRATEGIZANDO...");
            try {
                const prompt = `Gere uma estratégia completa de post de blog para a Pelimotion sobre "${keyword}".
                Retorne APENAS um JSON: {
                    "title": "título chamativo",
                    "slug": "url-slug",
                    "meta": "descrição seo",
                    "category": "categoria sugerida",
                    "suggestedImages": [
                        {"id": "hero", "prompt": "descrição visual cinemática para a capa"},
                        {"id": "visual-1", "prompt": "descrição para o meio do texto"},
                        {"id": "visual-2", "prompt": "descrição técnica ou conceitual"}
                    ]
                }`;
                const res = await askAI(prompt, 'flash');
                const data = JSON.parse(res.replace(/```json/g, '').replace(/```/g, '').trim());
                
                document.getElementById('f-title').value = data.title;
                document.getElementById('f-slug').value = data.slug;
                document.getElementById('f-metaDescription').value = data.meta;
                document.getElementById('f-category').value = data.category;
                
                renderImageSlots(data.suggestedImages);
            } catch(e) { alert("Erro na IA: " + e.message); }
            hideLoader();
        }

        async function aiStep2() {
            const title = document.getElementById('f-title').value;
            showLoader("PENSANDO TÓPICOS...");
            const res = await askAI(`Crie um outline para o post "${title}". Liste apenas os títulos das seções.`, 'flash');
            const list = document.getElementById('outline-list');
            list.innerHTML = "";
            res.split('\n').filter(l => l.trim()).forEach(line => addOutlineItem(line));
            hideLoader();
        }

        function addOutlineItem(val = "") {
            const div = document.createElement('div');
            div.style.display = 'flex'; div.style.gap = '10px'; div.style.marginBottom = '5px';
            div.innerHTML = `<input type="text" value="${val.replace(/^[-*]\s*/, '')}" style="flex:1"><button class="btn" onclick="this.parentElement.remove()">✕</button>`;
            document.getElementById('outline-list').appendChild(div);
        }

        async function aiStep3() {
            const title = document.getElementById('f-title').value;
            const outlines = Array.from(document.querySelectorAll('#outline-list input')).map(i => i.value);
            showLoader("REDIGINDO...");
            let content = `# ${title}\n\n`;
            for (let sec of outlines) {
                const res = await askAI(`Escreva a seção "${sec}" do artigo "${title}". Use tom profissional e engajador.`, 'pro');
                content += res + "\n\n";
                document.getElementById('f-content').value = content;
            }
            hideLoader();
        }

        // --- SAVING ---
        async function savePost() {
            showLoader("SALVANDO...");
            const v = id => document.getElementById(id).value;
            const data = {
                data: {
                    title: v('f-title'),
                    slug: v('f-slug'),
                    status: v('f-status'),
                    category: v('f-category'),
                    metaDescription: v('f-metaDescription'),
                    keywords: [v('f-keyword')],
                    date: v('f-date') || new Date().toISOString().split('T')[0],
                    images: currentPost.data.images
                },
                content: v('f-content')
            };
            
            try {
                const res = await fetch('/api/blog/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) alert("💾 SALVO COM SUCESSO!");
                else throw new Error("Erro ao salvar");
                loadPosts();
            } catch(e) { alert(e.message); }
            hideLoader();
        }

        async function deployToVercel() {
            const hook = localStorage.getItem('pelimotion_deploy_hook');
            if (!hook) return alert("Configure o Deploy Hook primeiro!");
            showLoader("DISPARANDO VERCEL...");
            await fetch(hook, { method: 'POST' });
            hideLoader();
            alert("Foguete disparado! O site será atualizado em 2-3 minutos.");
        }

        // --- GALLERY ---
        let targetSlotIndex = -1;
        async function openGallery(slotIndex = -1) {
            targetSlotIndex = slotIndex;
            document.getElementById('modal').style.display = 'flex';
            showLoader("BUSCANDO GALERIA...");
            try {
                const res = await fetch('/api/blog/gallery');
                const images = await res.json();
                const grid = document.getElementById('gallery-grid');
                grid.innerHTML = "";
                images.forEach(img => {
                    const div = document.createElement('div');
                    div.style.cursor = 'pointer';
                    div.innerHTML = `<img src="${CDN}${img.path}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:4px;">`;
                    div.onclick = () => selectFromGallery(img.path);
                    grid.appendChild(div);
                });
            } catch(e) { alert(e.message); }
            hideLoader();
        }

        function selectFromGallery(path) {
            if (targetSlotIndex === -1) return;
            currentPost.data.images[targetSlotIndex].url = path;
            renderImageSlots(currentPost.data.images);
            document.getElementById('modal').style.display = 'none';
        }

        function showLoader(text) {
            document.getElementById('loader-text').innerText = text;
            document.getElementById('loader').style.display = 'flex';
        }
        function hideLoader() { document.getElementById('loader').style.display = 'none'; }

        // Start auth check
        checkAuth();
    </script>
</body>
</html>
