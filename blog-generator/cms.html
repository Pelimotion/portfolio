<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELIMOTION | STUDIO HUB v6.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000; --bg-card: #0a0a0a; --border: #222;
            --accent: #ff4b2b; --text: #f0f0f0; --text-dim: #666;
            --font-main: 'Outfit', sans-serif; --font-mono: 'DM Mono', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-main); height: 100vh; overflow: hidden; }
        
        /* Brutalist Layout */
        .app { display: grid; grid-template-rows: 50px 1fr; height: 100vh; }
        .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid var(--border); background: #000; z-index: 100; }
        .main { display: flex; height: 100%; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 340px; border-right: 2px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; background: #000; }
        .sidebar-section { border-bottom: 1px solid var(--border); padding: 20px; }
        .sidebar-title { font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin-bottom: 15px; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; }

        /* Workspace */
        .workspace { flex: 1; overflow-y: auto; padding: 40px; position: relative; }
        
        /* Cards & Fields */
        .card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; margin-bottom: 25px; border-radius: 0; }
        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 9px; font-family: var(--font-mono); text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
        input, select, textarea { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 0; font-family: inherit; font-size: 13px; }
        textarea { resize: vertical; min-height: 40px; }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }

        .btn { background: #000; border: 1px solid var(--border); color: #fff; padding: 8px 16px; cursor: pointer; font-size: 10px; font-family: var(--font-mono); text-transform: uppercase; transition: 0.2s; }
        .btn:hover { background: var(--border); }
        .btn.primary { background: #fff; color: #000; border-color: #fff; font-weight: bold; }
        .btn.ai { border-color: var(--accent); color: var(--accent); }
        .btn.ai:hover { background: var(--accent); color: #fff; }
        .btn.small { padding: 4px 8px; font-size: 9px; }

        /* Workflow */
        .tabs { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid var(--border); }
        .tab { background: transparent; border: none; color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; cursor: pointer; padding: 10px 0; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        .stage { display: none; }
        .stage.active { display: block; }

        /* Image Manager - Relational */
        .slot-stack { display: flex; flex-direction: column; gap: 15px; }
        .slot-item { display: grid; grid-template-columns: 200px 1fr; gap: 20px; background: #050505; border: 1px solid var(--border); padding: 15px; }
        .slot-preview { width: 100%; aspect-ratio: 16/9; background: #111; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
        .slot-preview img { width: 100%; height: 100%; object-fit: cover; }
        .slot-info { display: flex; flex-direction: column; gap: 10px; }
        .slot-controls { display: flex; gap: 10px; margin-top: auto; flex-wrap: wrap; }

        /* Presets Explorer */
        .preset-manager { display: grid; grid-template-columns: 250px 1fr; gap: 30px; height: 600px; }
        .preset-list { border-right: 1px solid var(--border); overflow-y: auto; padding-right: 20px; }
        .preset-item { padding: 10px; border: 1px solid transparent; cursor: pointer; font-size: 11px; margin-bottom: 5px; }
        .preset-item:hover { background: #111; }
        .preset-item.active { border-color: var(--accent); color: var(--accent); background: #0a0a0a; }

        /* Loader */
        #loader { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; flex-direction: column; }
        .spinner { width: 30px; height: 30px; border: 2px solid #222; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Post List */
        .post-list { display: flex; flex-direction: column; gap: 2px; }
        .post-link { padding: 8px 12px; font-size: 11px; color: var(--text-dim); cursor: pointer; transition: 0.1s; border-left: 2px solid transparent; }
        .post-link:hover { color: #fff; background: #111; }
        .post-link.active { color: #fff; background: #1a1a1a; border-left-color: var(--accent); }

        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 500; }
        .modal-body { background: #000; border: 1px solid var(--border); padding: 30px; width: 90%; max-width: 1000px; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text" style="margin-top:20px; font-family:var(--font-mono); font-size:10px; color:var(--accent);">SYNCING...</div>
    </div>

    <div class="app">
        <nav class="top-nav">
            <div style="font-family:var(--font-mono); font-size:12px; font-weight:bold;">PELIMOTION <span style="color:var(--accent)">STUDIO v6.0</span></div>
            <div style="display:flex; gap:10px;">
                <button class="btn small" onclick="openGallery()">BIBLIOTECA</button>
                <button class="btn small ai" onclick="savePost()">SALVAR ARTIGO</button>
                <button class="btn small primary" onclick="deployToVercel()">PUBLICAR NO SITE</button>
            </div>
        </nav>

        <div class="main">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">SESSÃO ATIVA</div>
                    <div class="field">
                        <label>Status</label>
                        <select id="f-status">
                            <option value="draft">RASCUNHO (DRAFT)</option>
                            <option value="published">PUBLICADO (LIVE)</option>
                            <option value="review">REVISÃO (PENDING)</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Categoria</label>
                        <input type="text" id="f-category">
                    </div>
                    <div class="field">
                        <label>URL Slug</label>
                        <input type="text" id="f-slug">
                    </div>
                    <div class="field">
                        <label>Data de Publicação</label>
                        <input type="date" id="f-date">
                    </div>
                </div>

                <div class="sidebar-section" style="flex:1; overflow-y:auto;">
                    <div class="sidebar-title">ARQUIVOS <button class="btn small" onclick="createNewPost()" style="float:right;">+</button></div>
                    <div id="post-list" class="post-list"></div>
                </div>

                <div class="sidebar-section" style="border-top: 1px solid var(--border);">
                    <div class="sidebar-title">STUDIO CONFIG</div>
                    <input type="password" id="studio-pin" placeholder="PIN ACCESS" style="font-size:10px; margin-bottom:10px;" onkeyup="if(event.key==='Enter') checkAuth()">
                    <button class="btn" style="width:100%" onclick="checkAuth()">AUTHENTICATE</button>
                    <div id="auth-status" style="font-size:9px; color:var(--text-dim); margin-top:8px; text-align:center;">OFFLINE</div>
                </div>
            </aside>

            <main class="workspace">
                <div class="tabs">
                    <button class="tab active" onclick="switchStage(1)">01 STRATEGY</button>
                    <button class="tab" onclick="switchStage(2)">02 STRUCTURE</button>
                    <button class="tab" onclick="switchStage(3)">03 CONTENT</button>
                    <button class="tab" onclick="switchStage(4)">04 VISUAL ASSETS</button>
                    <button class="tab" onclick="switchStage(5)">05 CONFIGS</button>
                </div>

                <!-- Stage 1: Strategy -->
                <div class="stage active" id="stage-1">
                    <div class="card">
                        <div class="sidebar-title">IDEIA & SEO</div>
                        <div class="field">
                            <label>Keyword / Central Theme</label>
                            <div style="display:flex; gap:10px;">
                                <input type="text" id="f-keyword" placeholder="ex: motion branding 2026">
                                <button class="btn ai" onclick="aiStep1()">THINK STRATEGY</button>
                            </div>
                        </div>
                        <div class="field">
                            <label>Article Title</label>
                            <input type="text" id="f-title" style="font-size:20px; font-weight:600;">
                        </div>
                        <div class="field">
                            <label>Meta Title (SEO)</label>
                            <input type="text" id="f-metaTitle">
                        </div>
                        <div class="field">
                            <label>Meta Description</label>
                            <textarea id="f-metaDescription" rows="3"></textarea>
                        </div>
                    </div>
                    <div id="trends-panel" class="card" style="display:none; border-color:var(--accent);">
                        <div class="sidebar-title">🔥 TRENDING ANGLES</div>
                        <div id="trends-list" style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; font-size:11px;"></div>
                    </div>
                </div>

                <!-- Stage 2: Structure -->
                <div class="stage" id="stage-2">
                    <div class="card">
                        <div class="sidebar-title">CONTENT OUTLINE <button class="btn ai" style="float:right" onclick="aiStep2()">AUTO STRUCTURE</button></div>
                        <div id="outline-list"></div>
                        <button class="btn small" style="margin-top:15px;" onclick="addOutlineItem()">+ NEW SECTION</button>
                    </div>
                </div>

                <!-- Stage 3: Content -->
                <div class="stage" id="stage-3">
                    <div class="card" style="height: calc(100vh - 250px); display:flex; flex-direction:column;">
                        <div class="sidebar-title">WRITING PIPELINE <button class="btn ai" style="float:right" onclick="aiStep3()">COMPILE ARTICLE</button></div>
                        <div id="writing-progress" style="font-size:9px; color:var(--accent); margin-bottom:10px;"></div>
                        <textarea id="f-content" style="flex:1; font-family:var(--font-mono); line-height:1.8; padding:20px; background:#050505;"></textarea>
                    </div>
                </div>

                <!-- Stage 4: Visuals -->
                <div class="stage" id="stage-4">
                    <div class="card">
                        <div class="sidebar-title">
                            SLOT MANAGER
                            <div style="display:flex; gap:10px;">
                                <button class="btn small ai" onclick="aiGeneratePrompts()">✨ AI SYNC</button>
                                <button class="btn small" onclick="addSlot()">+ ADD SLOT</button>
                            </div>
                        </div>
                        <div id="slot-grid" class="slot-stack"></div>
                    </div>
                </div>

                <!-- Stage 5: Configs -->
                <div class="stage" id="stage-5">
                    <div class="card">
                        <div class="sidebar-title">PRESETS LIBRARY</div>
                        <div class="preset-manager">
                            <div class="preset-list" id="preset-list-ui"></div>
                            <div class="preset-editor">
                                <div class="field">
                                    <label>Preset Name</label>
                                    <input type="text" id="p-name">
                                </div>
                                <div class="field">
                                    <label>Section Context</label>
                                    <select id="p-section">
                                        <option value="Strategy">Strategy</option>
                                        <option value="Outline">Outline</option>
                                        <option value="Writing">Writing</option>
                                        <option value="Visual">Visual</option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label>Prompt Template / Guidelines</label>
                                    <textarea id="p-content" style="height:300px;"></textarea>
                                </div>
                                <div style="display:flex; gap:10px;">
                                    <button class="btn primary" onclick="savePreset()">SAVE PRESET</button>
                                    <button class="btn" onclick="clearPresetForm()">NEW</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Gallery Modal -->
    <div id="modal">
        <div class="modal-body">
            <div class="sidebar-title">CDN LIBRARY <button class="btn small" style="float:right" onclick="closeModal()">CLOSE</button></div>
            <div id="gallery-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:15px;"></div>
        </div>
    </div>

    <script>
        // --- ArticleSession Engine ---
        let Session = {
            id: null,
            meta: {},
            outline: [],
            content: "",
            images: [],
            presets: { strategy: null, writing: null, visual: null },
            lastSaved: null
        };

        let posts = [];
        let presets = [];
        let targetSlotIndex = -1;
        const CDN = 'https://pelimotion-portfolio.b-cdn.net';

        // --- AUTH ---
        function checkAuth() {
            const pin = document.getElementById('studio-pin').value || localStorage.getItem('studio_pin');
            if (pin === '0101') {
                localStorage.setItem('studio_pin', '0101');
                document.getElementById('auth-status').innerText = '✅ ONLINE';
                init();
            } else { alert('DENIED'); }
        }

        async function init() {
            showLoader("CONNECTING...");
            await loadPosts();
            await loadPresets();
            hideLoader();
            setInterval(autoSave, 60000);
        }

        // --- CORE DATA ---
        async function loadPosts() {
            const res = await fetch('/api/blog/posts');
            posts = await res.json();
            const list = document.getElementById('post-list');
            list.innerHTML = "";
            posts.forEach(p => {
                const div = document.createElement('div');
                div.className = `post-link ${Session.id === p.id ? 'active' : ''}`;
                div.innerText = p.title || 'Untitled';
                div.onclick = () => openPost(p);
                list.appendChild(div);
            });
        }

        function openPost(p) {
            Session.id = p.id;
            Session.meta = { ...p.data, title: p.title, slug: p.slug, status: p.status, category: p.category, meta_description: p.meta_description, meta_title: p.meta_title };
            Session.content = p.content;
            Session.images = p.data.images || [];
            
            // Map UI
            const set = (id, val) => { const el = document.getElementById(id); if(el) el.value = val || ''; };
            set('f-title', p.title);
            set('f-slug', p.slug);
            set('f-status', p.status);
            set('f-category', p.category);
            set('f-metaTitle', p.meta_title || p.data.metaTitle);
            set('f-metaDescription', p.meta_description || p.data.metaDescription);
            set('f-date', (p.data.date || '').split('T')[0]);
            set('f-content', p.content);
            set('f-keyword', p.data.keywords?.[0]);

            renderSlots();
            loadPosts();
        }

        function createNewPost() {
            const id = 'new-' + Date.now();
            openPost({ id, title: "NOVO ARTIGO", slug: id, status: "draft", data: { images: [] }, content: "" });
        }

        // --- STAGES ---
        function switchStage(n) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i+1 === n));
            document.querySelectorAll('.stage').forEach((s, i) => s.classList.toggle('active', i+1 === n));
        }

        // --- IMAGE SLOTS ---
        function renderSlots() {
            const grid = document.getElementById('slot-grid');
            grid.innerHTML = "";
            Session.images.forEach((img, i) => {
                const div = document.createElement('div');
                div.className = 'slot-item';
                const imgSrc = img.url ? (img.url.startsWith('http') ? img.url : `${CDN}${img.url}`) : '';
                div.innerHTML = `
                    <div class="slot-preview">${imgSrc ? `<img src="${imgSrc}?t=${Date.now()}">` : 'NO IMAGE'}</div>
                    <div class="slot-info">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-size:10px; font-family:var(--font-mono); color:var(--accent);">SLOT: [img-${i+1}]</span>
                            <select style="width:auto; font-size:9px;" onchange="updateSlotRole(${i}, this.value)">
                                <option value="body" ${img.role==='body'?'selected':''}>BODY</option>
                                <option value="hero" ${img.role==='hero'?'selected':''}>HERO</option>
                                <option value="thumb" ${img.role==='thumb'?'selected':''}>THUMB</option>
                            </select>
                        </div>
                        <textarea placeholder="PROMPT..." onchange="updateSlotPrompt(${i}, this.value)">${img.prompt || ''}</textarea>
                        <div class="slot-controls">
                            <button class="btn small ai" onclick="generateSlot(${i})">GENERATE</button>
                            <button class="btn small" onclick="openGallery(${i})">LIBRARY</button>
                            <button class="btn small" onclick="moveSlot(${i}, -1)">↑</button>
                            <button class="btn small" onclick="moveSlot(${i}, 1)">↓</button>
                            <button class="btn small" onclick="removeSlot(${i})">✕</button>
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function addSlot() { Session.images.push({ id: 'img-'+Date.now(), prompt: '', url: '', role: 'body' }); renderSlots(); }
        function removeSlot(i) { Session.images.splice(i, 1); renderSlots(); }
        function moveSlot(i, d) { 
            const target = i + d;
            if(target >= 0 && target < Session.images.length) {
                [Session.images[i], Session.images[target]] = [Session.images[target], Session.images[i]];
                renderSlots();
            }
        }
        function updateSlotRole(i, r) { Session.images[i].role = r; }
        function updateSlotPrompt(i, p) { Session.images[i].prompt = p; }

        // --- AI PIPELINE ---
        async function askAI(prompt, type) {
            const res = await fetch('/api/blog/generate-text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, modelType: type })
            });
            const data = await res.json();
            return data.content;
        }

        async function aiStep1() {
            const kw = document.getElementById('f-keyword').value;
            const context = await getPresets('Strategy');
            showLoader("BRAINSTORMING...");
            
            // Fetch Trends in parallel
            fetchTrends(kw);

            const res = await askAI(`Strategy for "${kw}". Guidelines: ${context}. Return JSON: {"title":"", "slug":"", "meta_title":"", "meta_description":""}`, 'flash');
            const data = JSON.parse(res.replace(/```json/g, '').replace(/```/g, '').trim());
            Object.keys(data).forEach(k => { const el = document.getElementById('f-'+k); if(el) el.value = data[k]; });
            hideLoader();
        }

        async function fetchTrends(topic) {
            const res = await fetch('/api/blog/fetch-trends', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic, category: document.getElementById('f-category').value })
            });
            const data = await res.json();
            const panel = document.getElementById('trends-panel');
            const list = document.getElementById('trends-list');
            panel.style.display = 'block';
            list.innerHTML = data.map(t => `
                <div style="background:#000; border:1px solid #111; padding:10px; cursor:pointer;" onclick="document.getElementById('f-title').value='${t.angle}'">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <span style="font-weight:bold; color:#fff;">${t.angle}</span>
                        <span style="color:var(--accent)">${t.hype}%</span>
                    </div>
                    <div style="font-size:9px; color:var(--text-dim)">${t.description}</div>
                </div>
            `).join('');
        }

        async function aiStep2() {
            const title = document.getElementById('f-title').value;
            const context = await getPresets('Outline');
            showLoader("STRUCTURING...");
            const res = await askAI(`Outline for "${title}". Guidelines: ${context}. List only H2s.`, 'flash');
            const list = document.getElementById('outline-list');
            list.innerHTML = "";
            res.split('\n').filter(l => l.trim()).forEach(l => {
                const div = document.createElement('div');
                div.style.display = 'flex'; div.style.marginBottom = '5px';
                div.innerHTML = `<input type="text" value="${l.replace(/^[-*]\s*/, '')}" style="flex:1"><button class="btn" onclick="this.parentElement.remove()">✕</button>`;
                list.appendChild(div);
            });
            hideLoader();
        }

        async function aiStep3() {
            const title = document.getElementById('f-title').value;
            const items = Array.from(document.querySelectorAll('#outline-list input')).map(i => i.value);
            const context = await getPresets('Writing');
            showLoader("WRITING...");
            let full = `# ${title}\n\n`;
            for (let i=0; i < items.length; i++) {
                document.getElementById('writing-progress').innerText = `WRITING SECTION ${i+1}/${items.length}: ${items[i]}`;
                const res = await askAI(`Write section "${items[i]}" for article "${title}". Guidelines: ${context}. Include placeholder [img-${i+1}] if it fits.`, 'pro');
                full += res + "\n\n";
                document.getElementById('f-content').value = full;
            }
            hideLoader();
        }

        async function aiGeneratePrompts() {
            const content = document.getElementById('f-content').value;
            const context = await getPresets('Visual');
            showLoader("SYNCING VISUALS...");
            const res = await askAI(`Analyze article: "${content}". Suggest ${Session.images.length} photorealistic prompts. Guidelines: ${context}. JSON array: ["p1", "p2", ...]`, 'flash');
            const data = JSON.parse(res.replace(/```json/g, '').replace(/```/g, '').trim());
            data.forEach((p, i) => { if(Session.images[i]) Session.images[i].prompt = p; });
            renderSlots();
            hideLoader();
        }

        async function generateSlot(i) {
            const img = Session.images[i];
            const slug = document.getElementById('f-slug').value;
            showLoader("IMAGING...");
            const res = await fetch('/api/blog/generate-image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: img.prompt, slug, imageName: 'img-'+(i+1) })
            });
            if (res.ok) {
                Session.images[i].url = `/blog/assets/${slug}/img-${i+1}.jpg`;
                renderSlots();
            }
            hideLoader();
        }

        // --- PRESETS ---
        async function loadPresets() {
            const res = await fetch('/api/blog/guidelines');
            presets = await res.json();
            const list = document.getElementById('preset-list-ui');
            list.innerHTML = presets.map(p => `
                <div class="preset-item" onclick="editPreset(${p.id})">
                    <strong>${p.preset_name}</strong><br>
                    <small>${p.section} | ${p.is_active ? 'ACTIVE' : 'OFF'}</small>
                </div>
            `).join('');
        }

        async function getPresets(section) {
            return presets.filter(p => p.section === section && p.is_active).map(p => p.content).join('\n');
        }

        function editPreset(id) {
            const p = presets.find(x => x.id == id);
            document.getElementById('p-name').value = p.preset_name;
            document.getElementById('p-section').value = p.section;
            document.getElementById('p-content').value = p.content;
            document.getElementById('p-name').dataset.id = p.id;
        }

        async function savePreset() {
            const id = document.getElementById('p-name').dataset.id;
            const body = {
                presetName: document.getElementById('p-name').value,
                section: document.getElementById('p-section').value,
                content: document.getElementById('p-content').value,
                isActive: true,
                category: 'Global'
            };
            await fetch('/api/blog/guidelines', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            await loadPresets();
            alert("PRESET SAVED");
        }

        function clearPresetForm() {
            document.getElementById('p-name').value = '';
            document.getElementById('p-content').value = '';
            delete document.getElementById('p-name').dataset.id;
        }

        // --- SAVE & DEPLOY ---
        function getPayload() {
            const v = id => document.getElementById(id).value;
            return {
                id: Session.id,
                title: v('f-title'),
                slug: v('f-slug'),
                status: v('f-status'),
                category: v('f-category'),
                meta_title: v('f-metaTitle'),
                meta_description: v('f-metaDescription'),
                content: v('f-content'),
                data: {
                    date: v('f-date'),
                    keywords: (v('f-keyword')||'').split(',').map(k => k.trim()),
                    images: Session.images
                }
            };
        }

        async function savePost() {
            showLoader("SAVING...");
            const payload = getPayload();
            const res = await fetch('/api/blog/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) { Session.lastSaved = new Date(); loadPosts(); }
            hideLoader();
            return res.ok;
        }

        function autoSave() {
            if(Session.id) {
                const payload = getPayload();
                localStorage.setItem('cms_autosave_' + Session.id, JSON.stringify(payload));
            }
        }

        async function deployToVercel() {
            const saved = await savePost();
            if(!saved) return;
            showLoader("DEPLOYING...");
            const hook = 'https://api.vercel.com/v1/integrations/deploy/prj_CgWzE6E3qfS7wW8j8q7F4M0y9h2R/3Zz3z3z3z3';
            try {
                await fetch(hook, { method: 'POST' });
                alert("DEPLOY QUEUED");
            } catch(e) { alert("DEPLOY ERROR: " + e.message); }
            hideLoader();
        }

        // --- GALLERY ---
        async function openGallery(i = -1) {
            targetSlotIndex = i;
            document.getElementById('modal').style.display = 'flex';
            const res = await fetch('/api/blog/gallery');
            const data = await res.json();
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = data.map(img => `
                <div style="border:1px solid #111; cursor:pointer;" onclick="selectImage('${img.url}')">
                    <img src="${img.url}" style="width:100%; aspect-ratio:1; object-fit:cover;">
                </div>
            `).join('');
        }
        function selectImage(url) {
            if(targetSlotIndex !== -1) {
                Session.images[targetSlotIndex].url = url.split('.net')[1];
                renderSlots();
            }
            closeModal();
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function showLoader(t) { document.getElementById('loader-text').innerText = t; document.getElementById('loader').style.display = 'flex'; }
        function hideLoader() { document.getElementById('loader').style.display = 'none'; }

        checkAuth();
    </script>
</body>
</html>
